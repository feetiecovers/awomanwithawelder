kind = "web"
previewPath = "/"
title = "A Woman With a Welder"
version = "1.0.0"
id = "artifacts/awww-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19553

[services.development]
run = "pnpm --filter @workspace/awww-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/awww-site", "run", "build" ]
publicDir = "artifacts/awww-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19553"
BASE_PATH = "/"
